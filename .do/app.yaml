# DigitalOcean App Platform spec (optional — import in DO or use as reference).
# Set env vars in the App Platform dashboard; see .env.example.

name: faceattend-backend
region: nyc

services:
  - name: api
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    routes:
      - path: /
